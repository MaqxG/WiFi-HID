; PlatformIO Configuration for ESP32-S3 0.96" LCD Pocket Dongle
; Hardware: ESP32-S3 (16MB Flash, 8MB PSRAM N16R8, 0.96" ST7735 80x160 IPS LCD)
; Schematic: ESP32-S3-0.96LCD.pdf

[platformio]
default_envs = esp32-s3-dongle-n16r8

[env:esp32-s3-dongle-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor
monitor_speed = 115200

; 16MB Flash & 8MB Octal PSRAM configuration
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Upload settings
upload_speed = 921600

; Native USB CDC + HID (TinyUSB OTG Mode)
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
    -D BOARD_HAS_PSRAM
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/AsyncUDP/src"

; Deep dependency finder to resolve nested core library headers (e.g. FS.h for USB)
lib_ldf_mode = deep+

; Clean, reliable graphics libraries + core dependencies
lib_deps =
    FS
    Network
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
